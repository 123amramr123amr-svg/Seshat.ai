<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seshat.chet</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b24;
    --panel-2: #1c2430;
    --line: #2a3442;
    --text: #e8e3d6;
    --muted: #8d97a5;
    --gold: #d9a441;
    --gold-soft: rgba(217, 164, 65, .14);
    --user: #1f3a4d;
    --code-bg: #0a0e14;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header svg { flex: none; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .3px; direction: ltr; }
  .brand span { color: var(--gold); }
  .tagline { color: var(--muted); font-size: 13px; }
  .meta {
    margin-inline-start: auto;
    color: var(--muted);
    font-size: 12px;
    direction: ltr;
    text-align: left;
    white-space: nowrap;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 8px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  .welcome { text-align: center; padding: 6vh 0 12px; }
  .welcome h1 { font-size: 26px; margin: 14px 0 4px; font-weight: 700; }
  .welcome p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--gold); background: var(--gold-soft); }

  .msg { display: flex; margin: 14px 0; gap: 10px; }
  .msg.user { justify-content: flex-start; }
  .msg.bot { justify-content: flex-end; flex-direction: row-reverse; }
  .avatar {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
    margin-top: 4px;
  }
  .user .avatar { background: var(--user); color: #bfe0f5; }
  .bot .avatar { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); }
  .bubble {
    max-width: min(640px, 82%);
    padding: 10px 14px;
    border-radius: 14px;
    overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--user); border-start-start-radius: 4px; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-start-end-radius: 4px; }
  .bubble p { margin: 0 0 6px; white-space: pre-wrap; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble.fallback { border-style: dashed; color: var(--muted); }
  .foot { color: var(--muted); font-size: 11px; margin-top: 6px; direction: ltr; text-align: left; }
  .think {
    color: var(--muted); font-size: 12.5px;
    border-inline-start: 2px solid var(--gold);
    padding: 1px 8px; margin: 0 0 8px;
    background: var(--gold-soft); border-radius: 4px;
  }
  .think b { color: var(--gold); font-weight: 600; }
  .chip.suggest { display: block; margin-top: 10px; color: var(--text, inherit); }

  .code { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; direction: ltr; }
  .code-head {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel-2);
    padding: 4px 10px;
    font-size: 12px; color: var(--muted);
    font-family: Consolas, "Courier New", monospace;
  }
  .copy {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 1px 9px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .copy:hover { color: var(--gold); border-color: var(--gold); }
  pre {
    margin: 0; padding: 12px 14px;
    background: var(--code-bg);
    color: #d6deeb;
    font-family: Consolas, "Cascadia Code", "Courier New", monospace;
    font-size: 13.5px; line-height: 1.55;
    overflow-x: auto; text-align: left;
    white-space: pre; tab-size: 4;
  }

  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); opacity: .35;
    animation: blink 1.1s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  footer { padding: 10px 16px 16px; background: var(--bg); }
  .composer {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px 8px 8px 12px;
  }
  .composer:focus-within { border-color: var(--gold); }
  textarea {
    flex: 1; resize: none;
    background: none; border: none; outline: none;
    color: var(--text); font: inherit;
    max-height: 140px; padding: 6px 4px;
  }
  textarea::placeholder { color: var(--muted); }
  #send {
    flex: none; width: 40px; height: 40px;
    border: none; border-radius: 12px;
    background: var(--gold); color: #1a1408;
    cursor: pointer; display: grid; place-items: center;
  }
  #send:disabled { opacity: .4; cursor: default; }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 11.5px; text-align: center; }

  @media (max-width: 600px) {
    .tagline, .meta { display: none; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<header>
  <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
    <!-- رمز سشات: نجمة بسبع رؤوس فوقها قوس -->
    <path d="M8 13a12 12 0 0 1 24 0" fill="none" stroke="#d9a441" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#d9a441" stroke-width="2" stroke-linecap="round">
      <line x1="20" y1="22" x2="20" y2="10"/>
      <line x1="20" y1="22" x2="29.4" y2="14.5"/>
      <line x1="20" y1="22" x2="31.7" y2="24.7"/>
      <line x1="20" y1="22" x2="25.2" y2="32.8"/>
      <line x1="20" y1="22" x2="14.8" y2="32.8"/>
      <line x1="20" y1="22" x2="8.3" y2="24.7"/>
      <line x1="20" y1="22" x2="10.6" y2="14.5"/>
    </g>
    <circle cx="20" cy="22" r="2.6" fill="#d9a441"/>
  </svg>
  <div>
    <div class="brand">seshat<span>.chet</span></div>
    <div class="tagline">نموذج ذكاء اصطناعي مصري مبني من الصفر</div>
  </div>
  <div class="meta" id="meta"></div>
</header>

<main id="scroll">
  <div class="wrap" id="chat">
    <div class="welcome" id="welcome">
      <h1>أهلاً، أنا seshat</h1>
      <p>بتكلم عربي وإنجليزي، وبكتب أكواد. جرب واحدة من دول:</p>
      <div class="chips">
        <button class="chip">اسمك ايه</button>
        <button class="chip">مين طورك</button>
        <button class="chip">اكتب كود بايثون يحسب المضروب</button>
        <button class="chip">مين بنى الهرم الاكبر</button>
        <button class="chip">يعني ايه book</button>
        <button class="chip">7 × 8</button>
        <button class="chip">عاصمة اليابان ايه</button>
        <button class="chip" dir="ltr">what can you do</button>
        <button class="chip" dir="ltr">write javascript code to reverse a string</button>
        <button class="chip" dir="ltr">what is a neural network</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" dir="auto" placeholder="اكتب رسالتك هنا…  /  Type your message…" maxlength="300"></textarea>
    <button id="send" title="إرسال" aria-label="إرسال">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </div>
  <div class="hint">seshat بيدوّر على أقرب سؤال يعرفه ويرد عليه — ولو مش متأكد هيسألك تقصد إيه. تطوير: عمرو أحمد</div>
</footer>

<script>
  var chat = document.getElementById("chat");
  var scroller = document.getElementById("scroll");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var busy = false;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function toBottom() { scroller.scrollTop = scroller.scrollHeight; }

  // بيقسم الرد لنص عادي وبلوكات كود (اللي بين ```)
  function renderInto(bubble, text) {
    bubble.textContent = "";
    var parts = text.split("```");
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (i % 2 === 1) {
        var nl = part.indexOf("\n");
        var lang = nl === -1 ? "" : part.slice(0, nl).trim();
        var code = nl === -1 ? part : part.slice(nl + 1);
        code = code.replace(/\n$/, "");
        var box = el("div", "code");
        var head = el("div", "code-head");
        head.appendChild(el("span", "", lang || "code"));
        var copy = el("button", "copy", "copy");
        (function (c, btn) {
          btn.addEventListener("click", function () {
            var done = function () { btn.textContent = "copied"; setTimeout(function () { btn.textContent = "copy"; }, 1200); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(c).then(done, function () {});
            } else {
              var ta = el("textarea"); ta.value = c; document.body.appendChild(ta);
              ta.select(); try { document.execCommand("copy"); done(); } catch (e) {}
              document.body.removeChild(ta);
            }
          });
        })(code, copy);
        head.appendChild(copy);
        box.appendChild(head);
        box.appendChild(el("pre", "", code));
        bubble.appendChild(box);
      } else {
        var t = part.replace(/^\n+|\n+$/g, "");
        if (t) {
          var p = el("p", "", t);
          p.dir = "auto";
          bubble.appendChild(p);
        }
      }
    }
  }

  function addMessage(role, text) {
    var w = document.getElementById("welcome");
    if (w) w.remove();
    var row = el("div", "msg " + role);
    row.appendChild(el("div", "avatar", role === "user" ? "إ" : "س"));
    var bubble = el("div", "bubble");
    if (text !== undefined) renderInto(bubble, text);
    row.appendChild(bubble);
    chat.appendChild(row);
    toBottom();
    return bubble;
  }

  // بيكتب الرد تدريجي عشان يبان إنه بيتولّد حرف حرف
  function typeOut(bubble, text, done) {
    var n = 0;
    var stepSize = Math.max(2, Math.ceil(text.length / 90));
    (function tick() {
      n = Math.min(text.length, n + stepSize);
      var shown = text.slice(0, n);
      if ((shown.split("```").length - 1) % 2 === 1) shown += "\n```";
      renderInto(bubble, shown);
      toBottom();
      if (n < text.length) setTimeout(tick, 16); else done();
    })();
  }

  function send(text) {
    text = (text || input.value).trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = "";
    autosize();
    addMessage("user", text);

    var bubble = addMessage("bot");
    var dots = el("span", "typing");
    dots.appendChild(el("i")); dots.appendChild(el("i")); dots.appendChild(el("i"));
    bubble.appendChild(dots);
    toBottom();

    var finish = function () { busy = false; sendBtn.disabled = false; input.focus(); };

    fetch("chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        if (data.fallback) bubble.classList.add("fallback");
        // سطر التفكير: النموذج فهم السؤال على إنه إيه
        var think = null;
        if (data.thinking) {
            think = el("div", "think");
            think.dir = "auto";
            think.appendChild(el("b", "", "التفكير: "));
            think.appendChild(document.createTextNode(data.thinking));
        }
        typeOut(bubble, data.response, function () {
          if (think) bubble.insertBefore(think, bubble.firstChild);
          if (data.suggestion) {
            // مش متأكد → زرار بالسؤال اللي يقصده، دوسة واحدة تبعته
            var hint = el("button", "chip suggest", data.suggestion);
            hint.dir = "auto";
            hint.addEventListener("click", function () { send(data.suggestion); });
            bubble.appendChild(hint);
          }
          if (!data.fallback) {
            var conf = Math.round((data.confidence || 0) * 100);
            var from = { "memory": "memory", "memory+model": "memory + model", "model": "model" }[data.source];
            bubble.appendChild(el("div", "foot",
              data.seconds + "s · " + (from ? from + " · " : "") + conf + "%"));
          }
          toBottom();
          finish();
        });
      })
      .catch(function () {
        bubble.classList.add("fallback");
        renderInto(bubble, "حصلت مشكلة في الاتصال بالسيرفر. اتأكد إن app.py شغال وجرب تاني.");
        finish();
      });
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(140, input.scrollHeight) + "px";
  }

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", function () { send(); });
  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () { send(c.textContent); });
  });

  fetch("info").then(function (r) { return r.json(); }).then(function (i) {
    document.getElementById("meta").textContent =
      i.params.toLocaleString("en") + " params · " + i.n_layer + " layers · " +
      i.block_size + " ctx · " + i.engine;
  }).catch(function () {});

  input.focus();
</script>
</body>
</html>
